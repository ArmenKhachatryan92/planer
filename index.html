<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>PLANER</title>
</head>
<body>
  <header><h1>PLANER</h1><p>Твой день под контролем</p></header>
  <main>
    <section class="toolbar">
      <input id="taskDate" type="date">
      <button id="addTask">＋ Новая задача</button>
    </section>
    <section class="entry" id="entry" hidden>
      <input id="taskTitle" placeholder="Название задачи">
      <textarea id="taskNote" placeholder="Описание (необязательно)"></textarea>
      <div class="toolbar">
        <select id="taskPriority"><option>Средний</option><option>Высокий</option><option>Низкий</option></select>
        <button id="saveTask">Сохранить</button>
        <button class="secondary" id="cancelTask">Отмена</button>
      </div>
    </section>
    <section><h2>Задачи</h2><div id="tasks"></div></section>
  </main>
  <footer>PLANER · локальный режим</footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
