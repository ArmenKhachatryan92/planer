<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>PLANER</title></head>
<body><header><h1>PLANER</h1><p>Твой день под контролем</p><div id="connection" class="status">Не подключено</div></header>
<main><section id="auth" class="panel"><h2>Вход в PLANER</h2><p class="muted">Войди или создай аккаунт для облачной синхронизации.</p><input id="email" type="email" autocomplete="username" placeholder="Электронная почта"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль (не менее 8 символов)"><div class="toolbar"><button id="signIn">Войти</button><button id="signUp" class="secondary">Создать аккаунт</button></div><p id="authMessage" class="muted" aria-live="polite"></p></section>
<section id="app" hidden><div class="toolbar"><input id="taskDate" type="date"><button id="addTask">＋ Новая задача</button><button id="signOut" class="secondary">Выйти</button></div>
<section class="entry" id="entry" hidden><input id="taskTitle" placeholder="Название задачи"><textarea id="taskNote" placeholder="Описание (необязательно)"></textarea><div class="toolbar"><input id="taskTime" type="time"><select id="taskCategory"><option>Личное</option><option>Работа</option><option>Дом</option><option>Покупки</option><option>Другое</option></select><select id="taskPriority"><option>Средний</option><option>Высокий</option><option>Низкий</option></select><button id="saveTask">Сохранить</button><button class="secondary" id="cancelTask">Отмена</button></div></section>
<section><h2>Задачи</h2><div id="tasks"></div></section></section></main><footer>PLANER · облачная синхронизация</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
